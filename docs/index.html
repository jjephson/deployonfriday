    <script>
      (function () {
        var storageKey = 'deployonfriday-theme'
        var stored = localStorage.getItem(storageKey)
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = stored === 'light' || stored === 'dark' ? stored : (systemDark ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme

        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'dark' ? '#090a0c' : '#f3f4f6'
      })()
    </script>
    <script>
      (function () {
        var analyticsLoaded = false

        function loadAnalytics() {
          if (analyticsLoaded) return
          analyticsLoaded = true

          var script = document.createElement('script')
          script.src = 'https://cloud.umami.is/script.js'
          script.defer = true
          script.dataset.websiteId = 'f330449f-8390-4d0e-8993-c9f8e3b04ceb'
          document.head.appendChild(script)
        }

        // Defer analytics until idle or first interaction to avoid blocking bfcache.
        ;['pointerdown', 'keydown'].forEach(function (event) {
          window.addEventListener(event, loadAnalytics, { once: true, passive: true })
        })

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAnalytics, { timeout: 5000 })
        } else {
          window.addEventListener('load', function () { setTimeout(loadAnalytics, 3000) })
